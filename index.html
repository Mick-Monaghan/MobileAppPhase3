<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/flex-styling.css">
    <link rel="stylesheet" href="styles/index.css">

<body>
    <header>
        <h2>¤ 3042</h2>
        <p class="subtitle">36/sec</p>
    </header>
    <main>
        <button class="add-button">+10 Liquid Sugar</button>
        <p class="text-center">▼</p>
        <div class="card">
            <h2>Cauldron</h2>
            <div class="flex-col gap bars">
                <div class="progress-bar">
                    <div class="progress-bar-fill fill-half"></div>
                </div>
                <p class="text-center">▼</p>
                <p class="text-center">Boiling...</p>
                <p class="text-center">▼</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill fill-third"></div>
                </div>
            </div>
        </div>
        <p class="text-center">▼</p>
        <div class="card">
            <h2>Candy Stretcher</h2>
            <div class="flex-col gap bars">
                <div class="progress-bar">
                    <div class="progress-bar-fill fill-half"></div>
                </div>
                <p class="text-center">▼</p>
                <p class="text-center">Stretching...</p>
                <p class="text-center">▼</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill fill-third"></div>
                </div>
            </div>
        </div>
        <p class="text-center">▼</p>
        <div class="card">
            <h2>Cooler</h2>
            <div class="flex-col gap bars">
                <div class="progress-bar">
                    <div class="progress-bar-fill fill-half"></div>
                </div>
                <p class="text-center">▼</p>
                <p class="text-center">Cooling...</p>
                <p class="text-center">▼</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill fill-third"></div>
                </div>
            </div>
        </div>
    </main>
    <footer>
            <div class="navbar">
                <a href="index.html">
                    <div class="active-tab">
                        <img
                            src="assets/images/factory.svg"
                            alt="main tab icon"
                        />

                    </div>
                </a>
                <a href="upgrades.html">
                    <div>
                        <img
                            src="assets/images/star.svg"
                            alt="upgrades tab icon"
                        />
                        <p>UPGRADES</p>
                    </div>
                </a>
                <a href="rebirth.html">
                    <div>
                        <img
                            src="assets/images/reset.svg"
                            alt="rebirth tab icon"
                        />
                        <p>REBIRTH</p>

                </a>
                <a href="permanent.html">
                    <div clas="active-tab">

                        />
