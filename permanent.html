<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Permanent Upgrades</title>
        <link rel="stylesheet" href="styles/styles.css" />
        <link rel="stylesheet" href="styles/upgrades.css" />
    </head>
    <body>
        <header>
            <h2>Permanent Upgrades</h2>
        </header>
        <main>
            <!-- upgrade card template -->
            <div class="upgrade-card flex-col">
                <div class="upgrade-details">
                    <div class="flex-row justify-between">
                        <h3 class="upgrade-name">Cool Permanent Upgrade</h3>
                        <p class="upgrade-count">(x3)</p>
                    </div>
                    <p class="upgrade-boost">Increases sell value by 10%</p>
                    <p class="upgrade-effect">+30%</p>
                </div>
                <!-- bottom div -->
                <div class="buy-section flex-row justify-between">
                    <!-- buy x1 button -->
                    <div class="buy-button flex-row justify-between">
                        <p class="buy-count">buy x1:</p>
                        <p class="buy-cost">★2</p>
                    </div>
                    <!-- buy all button -->
                    <div class="buy-button flex-row justify-between">
                        <p class="buy-count">buy max:</p>
                        <p class="buy-cost">★4</p>
                    </div>
                </div>
            </div>
            <div class="upgrade-card flex-col">
                <div class="upgrade-details">
                    <div class="flex-row justify-between">
                        <h3 class="upgrade-name">
                            Also Cool Permanent Upgrade
                        </h3>
                        <p class="upgrade-count">(x2)</p>
                    </div>
                    <p class="upgrade-boost">Increases Machine speed by 5%</p>
                    <p class="upgrade-effect">+10%</p>
                </div>
                <!-- bottom div -->
                <div class="buy-section flex-row justify-between">
                    <!-- buy x1 button -->
                    <div class="buy-button flex-row justify-between">
                        <p class="buy-count">buy x1:</p>
                        <p class="buy-cost">★1</p>
                    </div>
                    <!-- buy all button -->
                    <div class="buy-button flex-row justify-between">
                        <p class="buy-count">buy max:</p>
                        <p class="buy-cost">★5</p>
                    </div>
                </div>
            </div>
            <!-- copy/paste of template above -->
        </main>
        <footer>
            <div class="navbar">
                <a href="index.html">
                    <div>
                        <img
                            src="assets/images/factory.svg"
                            alt="main tab icon"
                        />
                        <p>MAIN</p>
                    </div>
                </a>
                <a href="upgrades.html">
                    <div>
                        <img
                            src="assets/images/star.svg"
                            alt="upgrades tab icon"
                        />
                        <p>UPGRADES</p>
                    </div>
                </a>
                <a href="rebirth.html">
                    <div>
                        <img
                            src="assets/images/reset.svg"
                            alt="rebirth tab icon"
                        />
                        <p>REBIRTH</p>
                    </div>
                </a>
                <a href="permanent.html">
                    <div class="active-tab">
                        <img
                            src="assets/images/crown.svg"
                            alt="permanent tab icon"
                        />
                        <p>PERMANENT</p>
                    </div>
                </a>
            </div>
        </footer>
    </body>
</html>
